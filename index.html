<!doctype html>
<html>
<head>
	<link rel="preconnect" href="https://fonts.googleapis.com">

<body>
	<script src="main.js"></script>
	<div>
		<a href="index.html">		
			<img src="signature.png" id="titlemain">
		</a>
	</div>
	<div id="videodiv"></div>
	
	
	<script>
        function addCode() {
			//Génére la vidéo
			var nombre = Math.floor(Math.random() * 4);
            document.getElementById("videodiv")
                .innerHTML =
				`<video id="video-carrousel" autoplay muted src="`+ nombre + `.mp4" type="video/mp4"> video not supported </video>`;
			// Check si la video est fini
			document.getElementById('video-carrousel').addEventListener('ended',myHandler,false)
        }
		// Attend que la page load
		document.addEventListener("DOMContentLoaded", function() {
  		addCode();
		});
		// Recursive
		function myHandler() {
			addCode()
		};
    </script>
	
	
	<footer>

		</div>
	</footer>

</body>
</html>
